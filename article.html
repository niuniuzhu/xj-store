<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文章详情 · XJ Store</title>
<script src="assets/head.js"></script>
<link rel="stylesheet" href="assets/base.css" />
<style>
  /* 阅读进度条 */
  .progress {
    position: fixed; top: 0; left: 0; height: 3px; z-index: 80;
    background: linear-gradient(90deg, var(--primary), #7ab0ff); width: 0;
    transition: width .1s linear;
  }

  .wrap { width: 100%; max-width: min(var(--page-w), 100% - 32px); margin: 0 auto; padding: 22px 22px 0; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 22px; align-items: start; }

  .article { padding: 34px 40px 40px; }
  .a-tag { margin-bottom: 14px; }
  .a-title { font-size: 30px; font-weight: 800; line-height: 1.35; margin: 0 0 16px; letter-spacing: -.4px; }
  .a-meta { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-3); padding-bottom: 22px; border-bottom: 1px solid var(--border); }
  .a-meta .author { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-weight: 600; }
  .author-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), #7ab0ff);
    display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700;
  }
  .a-cover {
    height: 240px; border-radius: 12px; margin: 26px 0 30px;
    display: grid; place-items: center; font-size: 84px; position: relative; overflow: hidden;
  }
  .a-cover::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 28% 20%, rgba(255,255,255,.34), transparent 62%);
  }

  .prose { font-size: 15px; line-height: 1.95; color: var(--text); }
  .prose p { margin: 0 0 18px; }
  .prose h2 {
    font-size: 20px; font-weight: 700; margin: 34px 0 14px;
    padding-left: 12px; border-left: 3px solid var(--primary); scroll-margin-top: 80px;
  }
  .prose h3 { font-size: 16.5px; font-weight: 700; margin: 26px 0 10px; }
  .prose ul { margin: 0 0 18px; padding-left: 22px; }
  .prose li { margin-bottom: 8px; }
  .prose blockquote {
    margin: 0 0 18px; padding: 14px 18px; border-left: 3px solid var(--primary);
    background: var(--surface-2); border-radius: 0 8px 8px 0; color: var(--text-2);
  }
  .prose code {
    background: var(--surface-2); padding: 2px 6px; border-radius: 5px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13.5px; color: var(--primary);
  }
  .prose pre {
    background: #1f2329; color: #e6e8eb; padding: 16px 18px; border-radius: 10px;
    overflow-x: auto; margin: 0 0 20px; font-size: 13px; line-height: 1.7;
  }
  .prose pre code { background: none; color: inherit; padding: 0; }
  .prose img { max-width: 100%; border-radius: 10px; }

  .a-actions { display: flex; align-items: center; gap: 10px; margin-top: 34px; padding-top: 24px; border-top: 1px solid var(--border); }

  /* 目录 */
  .toc { position: sticky; top: calc(var(--header-h) + 22px); padding: 20px 18px; }
  .toc-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .toc-title::before { content: ""; width: 3px; height: 14px; border-radius: 2px; background: var(--primary); }
  .toc a {
    display: block; padding: 7px 10px; border-radius: 8px; font-size: 13px;
    color: var(--text-2); border-left: 2px solid transparent; transition: all .15s;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .toc a:hover { background: var(--surface-2); color: var(--text); }
  .toc a.active { color: var(--primary); background: var(--primary-soft); border-left-color: var(--primary); font-weight: 600; }
  .toc .rel { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border); }
  .toc .rel a { white-space: normal; line-height: 1.5; }

  .back-link { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 34px 0 10px; color: var(--text-2); font-size: 14px; }
  .back-link:hover { color: var(--primary); }
  .back-link svg { width: 16px; height: 16px; }

  html.mobile-layout {
    .layout { grid-template-columns: 1fr; }
    .toc { display: none; }
    .article { padding: 24px 20px 30px; }
    .a-title { font-size: 23px; }
    .wrap { padding: 16px 14px 0; }
  }
</style>
</head>
<body>

<div id="header"></div>

  </a>
</div>

<div id="footer"></div>

  2: { tag: '技术实践', title: '用 CSS 变量做一套可维护的主题系统', date: '2026-10-05', read: 9, views: 2361, emoji: '🎨',
       color: 'linear-gradient(135deg,#8b5cf6,#a78bfa)',
       body: `<p>给已有站点加深色模式，最痛苦的不是写两套配色，而是改完之后发现到处都是硬编码颜色。本文记录我们是如何用一套变量把这件事收敛掉的。</p>
<h2 id="s1">先把颜色收拢成语义变量</h2>
<p>不要在组件里写 <code>#fff</code> 或 <code>#333</code>，而是统一使用语义变量：<code>--surface</code> 表示卡片背景，<code>--text-2</code> 表示次级文字。这样换肤时只需要替换变量值。</p>
<h2 id="s2">用一个属性驱动切换</h2>
<p>我们选择把主题挂在根节点上，而不是给每个容器加类名：</p>
<pre><code>&lt;html data-theme="dark"&gt;
  ...
&lt;/html&gt;</code></pre>
<p>深色样式全部收敛到 <code>html[data-theme="dark"]</code> 这一条规则里，新增页面无需关心。</p>
<h2 id="s3">解决刷新白屏</h2>
<p>主题存在 localStorage，但如果在 body 加载后才应用，用户会看到一帧浅色。解决办法是在 <code>&lt;head&gt;</code> 里放一段同步脚本，在首帧渲染前把属性打上。</p>
<h2 id="s4">过渡不要常开</h2>
<p>如果给 body 常驻 transition，首次加载会看到颜色渐变，观感很差。我们的做法是切换瞬间临时加一个 class，几百毫秒后再移除。</p>
<blockquote>另外记得尊重 <code>prefers-reduced-motion</code>，对晕动敏感的用户关闭动画。</blockquote>` },

const id = Number(new URLSearchParams(location.search).get('id')) || 1;
const post = POSTS[id] || POSTS[1];
document.title = post.title + ' · XJ Store';

const articleEl = document.getElementById('article');
const tocEl = document.getElementById('toc');

articleEl.className = 'card article anim-up';
articleEl.innerHTML = `
  <div class="breadcrumb">
    <a href="store.html">首页</a><span class="sep">/</span>
    <a href="blog.html">博客</a><span class="sep">/</span>
    <span class="cur">${post.tag}</span>
  </div>
  <span class="tag blue a-tag">${post.tag}</span>
  <h1 class="a-title">${post.title}</h1>
  <div class="a-meta">
    <span class="author"><span class="author-avatar">X</span>XJ Store</span>
    <span>${post.date}</span>
    <span>${post.read} 分钟阅读</span>
    <span>${post.views.toLocaleString()} 次浏览</span>
  </div>
  <div class="a-cover" style="background:${post.color}">${post.emoji}</div>
  <div class="prose">${post.body}</div>
  <div class="a-actions">
    <button class="btn btn-ghost btn-sm" id="likeBtn">👍 有帮助</button>
    <button class="btn btn-outline btn-sm" id="copyBtn">复制链接</button>
  </div>`;

/* 目录 */
const headings = [...articleEl.querySelectorAll('.prose h2')];
const related = Object.entries(POSTS).filter(([k]) => Number(k) !== id).slice(0, 4);
tocEl.innerHTML = `
  <div class="toc-title">目录</div>
  ${headings.map(h => `<a href="#${h.id}">${h.textContent}</a>`).join('')}
  <div class="toc rel">
    <div class="toc-title">相关阅读</div>
    ${related.map(([k, p]) => `<a href="article.html?id=${k}">${p.title}</a>`).join('')}
  </div>`;

/* 滚动高亮 + 阅读进度 */
const links = [...tocEl.querySelectorAll('a[href^="#"]')];
const bar = document.getElementById('progress');
window.addEventListener('scroll', () => {
  const h = document.documentElement;
  const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
  bar.style.width = (isNaN(pct) ? 0 : pct) + '%';

  let cur = null;
  headings.forEach(h => { if (h.getBoundingClientRect().top < 120) cur = h.id; });
  links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#' + cur));
}, { passive: true });

document.getElementById('likeBtn').addEventListener('click', () => XJ.toast('感谢反馈！'));
document.getElementById('copyBtn').addEventListener('click', () => {
  navigator.clipboard?.writeText(location.href);
  XJ.toast('链接已复制');
});

XJ.init({ active: 'blog' });
</script>
