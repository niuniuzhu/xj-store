<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>管理后台 · XJ Store</title>
<script src="assets/head.js"></script>
<link rel="stylesheet" href="assets/base.css" />
<style>
  .wrap { width: 100%; max-width: min(var(--page-w), 100% - 32px); margin: 0 auto; padding: 24px 22px 0; }

  /* 门禁 */
  .gate { min-height: calc(100vh - var(--header-h) - 200px); display: grid; place-items: center; padding: 40px 20px; }
  .gate-card { width: 100%; max-width: 380px; padding: 34px 32px 30px; text-align: center; }
  .gate-ico {
    width: 58px; height: 58px; border-radius: 16px; margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--primary), #7ab0ff);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 8px 22px rgba(43, 109, 246, .35);
  }
  .gate-ico svg { width: 26px; height: 26px; }
  .gate h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .gate p { color: var(--text-3); font-size: 13px; margin: 0 0 24px; }
  .gate .input { text-align: left; }
  .gate-err { color: var(--red); font-size: 13px; margin-top: 12px; display: none; }
  .gate-err.show { display: block; }

  .admin-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 6px 2px 18px; }
  .admin-title { display: flex; align-items: center; gap: 9px; font-size: 22px; font-weight: 800; }
  .admin-title::before { content: ""; width: 3px; height: 20px; border-radius: 2px; background: var(--primary); }

  .tabs { position: relative; display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 999px; margin-bottom: 18px; width: fit-content; max-width: 100%; flex-wrap: nowrap; overflow-x: auto; box-shadow: var(--shadow-card); scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { position: relative; z-index: 2; padding: 8px 16px; border-radius: 999px; font-size: 13.5px; color: var(--text-2); background: transparent; border: none; cursor: pointer; transition: color .22s; white-space: nowrap; }
  .tabs button.active { color: #fff; font-weight: 600; }
  .tabs .tab-indicator { position: absolute; z-index: 1; top: 4px; bottom: 4px; left: 0; width: 0; border-radius: 999px; background: var(--primary); box-shadow: 0 4px 14px rgba(43, 109, 246, .35); transition: transform .32s cubic-bezier(.22, .61, .36, 1), width .32s cubic-bezier(.22, .61, .36, 1); will-change: transform, width; }

  .panel-card { padding: 22px 24px 24px; }
  .panel-card .section-title { margin-bottom: 18px; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-size: 12.5px; font-weight: 600; color: var(--text-3); padding: 0 10px 12px; border-bottom: 1px solid var(--border); }
  td { padding: 12px 10px; border-bottom: 1px solid var(--border); color: var(--text-2); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .td-name { color: var(--text); font-weight: 600; }
  .row-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .mini { padding: 5px 12px; border-radius: 7px; font-size: 12.5px; background: var(--surface-2); color: var(--text-2); transition: all .15s; cursor: pointer; border: none; }
  .mini:hover { background: var(--primary-soft); color: var(--primary); }
  .mini.danger:hover { background: #fff1f0; color: var(--red); }
  .thumb-sm { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px; }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 0 18px; }

  /* 弹窗 */
  .mask {
    position: fixed; inset: 0; z-index: 120; background: rgba(15, 18, 24, .5);
    display: none; align-items: center; justify-content: center; padding: 24px;
    backdrop-filter: blur(3px);
  }
  .mask.show { display: flex; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 620px; max-height: 88vh; overflow-y: auto;
    background: var(--surface); border-radius: var(--radius-lg); padding: 26px 28px 24px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .3); animation: popIn .22s cubic-bezier(.22,.61,.36,1);
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
  .modal h3 { margin: 0 0 20px; font-size: 18px; font-weight: 700; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .spec-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
  .spec-row .input { flex: 1; }
  .spec-row .input.w80 { flex: 0 0 110px; }
  .switch { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; }
  .switch input { accent-color: var(--primary); width: 16px; height: 16px; }
  .switch.switch-row { align-items: flex-start; padding: 8px 0; }
  .switch.switch-row input { margin-top: 2px; }
  .hint { font-size: 12.5px; color: var(--text-3); margin-top: 6px; line-height: 1.7; }
  .empty-row { text-align: center; padding: 40px 0; color: var(--text-3); }

  /* 看板 / 统计 */
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .stat { padding: 18px 20px; }
  .stat .n { font-size: 24px; font-weight: 800; margin-bottom: 4px; }
  .stat .t { font-size: 12.5px; color: var(--text-3); }
  .stat .n.c1 { color: var(--primary); } .stat .n.c2 { color: #f59e0b; } .stat .n.c3 { color: var(--green); }
  .dist-bar { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 14px 0 8px; background: var(--surface-2); }
  .dist-bar span { display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; transition: width .4s; }
  .dist-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--text-2); }
  .dist-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 6px; vertical-align: middle; }

  /* 搜索 */
  .search-box { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 14px; height: 42px; max-width: 320px; margin-bottom: 16px; }
  .search-box svg { width: 16px; height: 16px; color: var(--text-3); }
  .search-box input { flex: 1; border: none; outline: none; background: none; font-size: 14px; height: 100%; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }

  /* 卡密批次 */
  .batch { border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 14px; overflow: hidden; }
  .batch-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--surface-2); cursor: pointer; }
  .batch-head .bn { font-weight: 700; flex: 1; }
  .batch-keys { padding: 12px 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
  .batch-keys .k { padding: 6px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .batch-keys .k.used { opacity: .55; }
  .batch-keys .k .u { color: var(--green); font-size: 11px; }

  .perm-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .perm-tags .pt { font-size: 11.5px; padding: 3px 8px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }

  .alert.ok { background: #f6ffed; border: 1px solid #b7eb8f; color: #389e0d; }
  html[data-theme="dark"] .alert.ok { background: rgba(18, 161, 80, .12); border-color: rgba(18, 161, 80, .38); color: #5fd39a; }

  html.mobile-layout { .wrap { padding: 16px 14px 0; } }

  /* 维护模式开关 */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider {
    position: absolute; inset: 0; cursor: pointer; background: var(--border-strong);
    border-radius: 999px; transition: background .2s;
  }
  .switch .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .slider { background: var(--primary); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
</style>
</head>
<body>

<div id="header"></div>

<!-- 登录门禁 -->
<div id="gate" class="gate" style="display:none">
  <div class="card gate-card anim-up">
    <div class="gate-ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    </div>
    <h1>管理后台</h1>
    <p>仅限管理员账号进入</p>
    <div class="field">
      <input class="input" id="gUser" placeholder="管理员账号" autocomplete="username" />
    </div>
    <div class="field">
      <input class="input" id="gPass" type="password" placeholder="密码" autocomplete="current-password" />
    </div>
    <button class="btn btn-primary btn-block" id="gLogin">登 录</button>
    <div class="gate-err" id="gErr"></div>
  </div>
</div>

<!-- 后台主体 -->
<div id="app" class="wrap" style="display:none">
  <div class="admin-head">
    <div class="admin-title">管理后台</div>
    <div style="display:flex;align-items:center;gap:12px">
      <span class="tag blue" id="who"></span>
      <a class="btn btn-primary btn-sm" href="account-admin.html">批量管理账户 →</a>
      <button class="btn btn-outline btn-sm" id="logoutBtn">退出登录</button>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div id="tab-store" style="display:none"></div>
  <div id="tab-dash" style="display:none"></div>
  <div id="tab-accounts" style="display:none"></div>
  <div id="tab-products" style="display:none"></div>
  <div id="tab-categories" style="display:none"></div>
  <div id="tab-coupons" style="display:none"></div>
  <div id="tab-cards" style="display:none"></div>
  <div id="tab-orders" style="display:none"></div>
  <div id="tab-interactions" style="display:none"></div>
  <div id="tab-ai" style="display:none"></div>
  <div id="tab-pay" style="display:none"></div>
  <div id="tab-account" style="display:none"></div>
</div>

<!-- 通用弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <h3 id="mTitle">编辑</h3>
    <div id="mBody"></div>
    <div class="modal-foot">
      <button class="btn btn-outline" id="mCancel">取消</button>
      <button class="btn btn-primary" id="mSave">保存</button>
    </div>
  </div>
</div>

<div id="footer"></div>
<button class="to-top" id="toTop" title="回到顶部"></button>

<script src="assets/base.js"></script>
<script>
let CATS = [
  { id: 'bot', name: '测试机器人', icon: 'bot' }, { id: 'plugin', name: '测试插件', icon: 'plug' },
  { id: 'resource', name: '测试资源', icon: 'book' }, { id: 'service', name: '商品服务', icon: 'spark' },
];
/* 后台可选图标（与前台 store.html 的 ICONS 对应） */
const CAT_ICONS = ['grid', 'bot', 'plug', 'book', 'spark', 'cart'];
const TAG_COLORS = ['orange', 'blue', 'green'];
const LEVEL_OPTIONS = [
  { v: '', name: '未设置' }, { v: 'none', name: '无折扣' }, { v: 'lvip', name: 'LVIP(7折)' },
  { v: 'vip', name: 'VIP(4.5折)' }, { v: 'svip', name: 'SVIP(1.5折)' },
];

let TOKEN = sessionStorage.getItem('xj_admin_token') || '';
let PRODUCTS = [];
let CONFIG = {};
let ORDERS = [];
let LEVELS = {};

const gate = document.getElementById('gate');
const app = document.getElementById('app');
const mask = document.getElementById('mask');

/* ---------- 请求封装 ---------- */
async function api(url, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'x-admin-token': TOKEN }, opts.headers || {});
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  const r = await fetch(url, opts);
  const j = await r.json().catch(() => ({ ok: false, msg: '服务返回异常' }));
  if (r.status === 401 || r.status === 403) {
    if (j.msg) XJ.toast(j.msg);
    if (r.status === 401) logout();
    throw new Error(j.msg || '未授权');
  }
  return j;
}
function logout() {
  sessionStorage.removeItem('xj_admin_token');
  TOKEN = '';
  app.style.display = 'none';
  gate.style.display = '';
}
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;'); }

/* ---------- 通用弹窗 ---------- */
let modalSave = null;
function showModal(title, html, onSave) {
  document.getElementById('mTitle').textContent = title;
  document.getElementById('mBody').innerHTML = html;
  modalSave = onSave;
  mask.classList.add('show');
}
document.getElementById('mCancel').addEventListener('click', () => { mask.classList.remove('show'); modalSave = null; });
mask.addEventListener('click', e => { if (e.target === mask) { mask.classList.remove('show'); modalSave = null; } });
document.getElementById('mSave').addEventListener('click', () => { if (modalSave) { const fn = modalSave; modalSave = null; fn(); } });

/* ---------- 登录 ---------- */
document.getElementById('gLogin').addEventListener('click', async () => {
  const user = document.getElementById('gUser').value.trim();
  const pass = document.getElementById('gPass').value;
  const err = document.getElementById('gErr');
  err.classList.remove('show');
  if (!user || !pass) { err.textContent = '请输入账号和密码'; err.classList.add('show'); return; }
  try {
    const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user, pass }) });
    const j = await r.json();
    if (!j.ok) { err.textContent = j.msg || '登录失败'; err.classList.add('show'); return; }
    TOKEN = j.token;
    sessionStorage.setItem('xj_admin_token', TOKEN);
    await enter();
  } catch (e) { err.textContent = '无法连接服务，请确认服务已启动'; err.classList.add('show'); }
});
document.getElementById('gPass').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('gLogin').click(); });
document.getElementById('logoutBtn').addEventListener('click', () => { logout(); XJ.toast('已退出'); });

/* ---------- 进入后台 ---------- */
async function enter() {
  let st;
  try { st = await api('/api/admin/state'); }
  catch (e) { logout(); return; }
  if (!st.ok) { logout(); return; }
  PRODUCTS = st.products || [];
  CONFIG = st.config || {};
  ORDERS = st.orders || [];
  LEVELS = st.levels || {};
  if (Array.isArray(st.categories) && st.categories.length) CATS = st.categories;
  document.getElementById('who').textContent = '管理员：' + st.admin.user;
  gate.style.display = 'none';
  app.style.display = '';
  renderTabs();
  switchTab('store');
}

/* ---------- 标签页 ---------- */
const TABS = [
  { id: 'store', name: '商店基本管理' },
  { id: 'dash', name: '数据看板' },
  { id: 'accounts', name: '账户管理' },
  { id: 'products', name: '商品管理' },
  { id: 'categories', name: '分类管理' },
  { id: 'coupons', name: '折扣券管理' },
  { id: 'cards', name: '卡密管理' },
  { id: 'orders', name: '订单管理' },
  { id: 'interactions', name: '商品互动' },
  { id: 'ai', name: 'XJ AI 配置' },
  { id: 'pay', name: '支付配置' },
  { id: 'account', name: '账户安全' },
];
function renderTabs() {
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = TABS.map(t =>
    `<button data-tab="${t.id}">${t.name}</button>`).join('') + '<span class="tab-indicator"></span>';
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    switchTab(b.dataset.tab);
  });
}
function moveIndicator() {
  const tabs = document.getElementById('tabs');
  if (!tabs) return;
  const active = tabs.querySelector('button.active');
  const ind = tabs.querySelector('.tab-indicator');
  if (!active || !ind) return;
  ind.style.width = active.offsetWidth + 'px';
  ind.style.transform = 'translateX(' + active.offsetLeft + 'px)';
}
window.addEventListener('resize', () => requestAnimationFrame(moveIndicator));
document.addEventListener('xj:langchange', () => requestAnimationFrame(moveIndicator));
function switchTab(id) {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x.dataset.tab === id));
  TABS.forEach(t => { document.getElementById('tab-' + t.id).style.display = (t.id === id) ? '' : 'none'; });
  const map = {
    store: loadStore, dash: loadDash, accounts: loadAccounts, products: renderProducts,
    categories: renderCategories,
    coupons: loadCoupons, cards: loadCards, orders: renderOrders, interactions: loadInteractions,
    ai: renderAi, pay: renderPay, account: renderAccount,
  };
  if (map[id]) map[id]();
  requestAnimationFrame(moveIndicator);
}

/* =========================================================
   1. 商店基本管理
   ========================================================= */
async function loadStore() {
  let store = {};
  try { const j = await api('/api/admin/store'); store = j.store || {}; } catch (e) {}
  const pop = store.popup || {};
  const bg = store.background || {};
  const f = document.getElementById('tab-store');
  f.innerHTML = `
    <div class="card panel-card anim-up">
      <div class="section-title">商店基本设置</div>
      <div class="grid2">
        <div class="field"><label class="field-label">商店名称</label><input class="input" id="sName" value="${esc(store.name)}" /></div>
        <div class="field"><label class="field-label">商店标语</label><input class="input" id="sSlogan" value="${esc(store.slogan)}" /></div>
      </div>
      <div class="field"><label class="field-label">商店简介</label><textarea class="textarea" id="sDesc" rows="2">${esc(store.desc)}</textarea></div>
      <div class="grid2">
        <div class="field"><label class="field-label">联系邮箱</label><input class="input" id="sMail" value="${esc(store.contactMail)}" /></div>
        <div class="field"><label class="field-label">联系 QQ</label><input class="input" id="sQq" value="${esc(store.contactQq)}" /></div>
      </div>
      <div class="grid2">
        <div class="field"><label class="field-label">联系微信</label><input class="input" id="sWx" value="${esc(store.contactWechat)}" /></div>
        <div class="field"><label class="field-label">联系电话</label><input class="input" id="sPhone" value="${esc(store.contactPhone)}" /></div>
      </div>
      <div class="field"><label class="field-label">页脚文字</label><input class="input" id="sFooter" value="${esc(store.footerText)}" /></div>
      <div class="field"><label class="field-label">首页公告</label><textarea class="textarea" id="sAnnounce" rows="2">${esc(store.announcement)}</textarea></div>
      <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:12px">
        <label class="field-label" style="margin:0">随机背景图 <span style="color:var(--text-3);font-weight:400">（用户每次刷新/进入时请求一次图源，取一张随机图作站点背景）</span></label>
        <label class="switch"><input type="checkbox" id="sBgOn" ${bg.enabled ? 'checked' : ''} /><span class="slider"></span></label>
      </div>
      <div class="grid2">
        <div class="field"><label class="field-label">图源地址（每次返回随机图）</label><input class="input" id="sBgUrl" value="${esc(bg.url)}" placeholder="https://api.yppp.net/pc.php" /></div>
        <div class="field"><label class="field-label">不透明度（0.05–1，越小越淡）</label><input class="input" id="sBgOp" type="number" step="0.05" min="0.05" max="1" value="${bg.opacity != null ? bg.opacity : 0.18}" /></div>
      </div>
      <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:12px">
        <label class="field-label" style="margin:0">首页弹窗公告 <span style="color:var(--text-3);font-weight:400">（开启后访客每天首次进入商店首页弹一次）</span></label>
        <label class="switch"><input type="checkbox" id="sPopOn" ${pop.enabled ? 'checked' : ''} /><span class="slider"></span></label>
      </div>
      <div class="grid2">
        <div class="field"><label class="field-label">版本号（改动后会对已看过的访客再弹一次）</label><input class="input" id="sPopVer" value="${esc(pop.version)}" placeholder="如 3.8.0" /></div>
        <div class="field"><label class="field-label">跳转链接（选填）</label><input class="input" id="sPopLink" value="${esc(pop.link)}" placeholder="如 article.html?id=8" /></div>
      </div>
      <div class="field"><label class="field-label">弹窗标题</label><input class="input" id="sPopTitle" value="${esc(pop.title)}" placeholder="如：XJ Store v3.8.0 更新公告" /></div>
      <div class="field"><label class="field-label">弹窗内容</label><textarea class="textarea" id="sPopBody" rows="3">${esc(pop.content)}</textarea></div>
      <div class="field"><label class="field-label">按钮文字</label><input class="input" id="sPopBtn" value="${esc(pop.linkText)}" placeholder="查看完整更新内容" /></div>
      <div class="field" style="flex-direction:row;align-items:center;justify-content:space-between;gap:12px">
        <label class="field-label" style="margin:0">维护模式 <span style="color:var(--text-3);font-weight:400">（开启后访客将被引导至维护页，仅管理员可访问）</span></label>
        <label class="switch"><input type="checkbox" id="sMaint" ${store.maintenance ? 'checked' : ''} /><span class="slider"></span></label>
      </div>
      <div class="field"><label class="field-label">维护提示（选填，展示在维护页）</label><textarea class="textarea" id="sMaintMsg" rows="2">${esc(store.maintenanceMsg || '')}</textarea></div>
      <div class="modal-foot" style="justify-content:flex-start">

function renderSpecs() {
  const p = window.__draft;
  const box = document.getElementById('fSpecs');
  box.innerHTML = p.specs.map((s, i) => `
    <div class="spec-row"><input class="input" data-sn="${i}" value="${esc(s.name)}" placeholder="规格名称" />

      <input class="input w80" data-ss="${i}" type="number" value="${s.stock}" placeholder="库存" />
      <button class="mini danger" data-sd="${i}">删除</button></div>`).join('');
  box.querySelectorAll('[data-sn]').forEach(el => el.addEventListener('input', () => { p.specs[el.dataset.sn].name = el.value; }));
  box.querySelectorAll('[data-sp]').forEach(el => el.addEventListener('input', () => {
    const v = String(el.value).trim();
    if (v === '') delete p.specs[el.dataset.sp].price; else p.specs[el.dataset.sp].price = Number(v) || 0;

  box.querySelectorAll('[data-ss]').forEach(el => el.addEventListener('input', () => { p.specs[el.dataset.ss].stock = Number(el.value) || 0; }));
  box.querySelectorAll('[data-sd]').forEach(el => el.addEventListener('click', () => { p.specs.splice(Number(el.dataset.sd), 1); renderSpecs(); }));
}

    const handler = () => { const i = Number(el.dataset.ci); CATS[i][el.dataset.f] = el.value.trim(); };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });

  const addBtn = document.getElementById('addCat');
  if (addBtn) addBtn.addEventListener('click', () => {
    let n = CATS.length + 1, id = 'cat' + n;
    while (CATS.some(c => c.id === id)) id = 'cat' + (++n);
    CATS.push({ id, name: '新分类', icon: 'grid' });
    renderCategories();
    XJ.toast('已新增，记得点保存');
  });

  box.querySelectorAll('[data-cdel]').forEach(el => el.addEventListener('click', () => {
    const i = Number(el.dataset.cdel);
    const used = PRODUCTS.filter(p => p.cat === CATS[i].id).length;
    if (used) { XJ.toast(`「${CATS[i].name}」下还有 ${used} 件商品，请先移到其他分类再删除`); return; }
    if (!confirm(`确定删除分类「${CATS[i].name}」？`)) return;
    CATS.splice(i, 1);
    renderCategories();
  }));

  const saveBtn = document.getElementById('catSave');
  if (saveBtn) saveBtn.addEventListener('click', saveCategories);
}

async function saveCategories() {
  for (const c of CATS) {
    if (!String(c.id || '').trim()) { XJ.toast('分类标识不能为空'); return; }
    if (!String(c.name || '').trim()) { XJ.toast('分类名称不能为空'); return; }
  }
  const ids = CATS.map(c => String(c.id).trim());
  if (new Set(ids).size !== ids.length) { XJ.toast('分类标识不能重复'); return; }
  const r = await api('/api/admin/categories', { method: 'POST', body: JSON.stringify({ list: CATS }) });
  if (r.ok) { XJ.toast('分类已保存（' + r.count + ' 个）'); renderCategories(); }
  else XJ.toast(r.msg || '保存失败');
}

    </div>

      <div class="field"><label class="field-label">发放总量</label><input class="input" id="cTotal" type="number" value="${c.total || 0}" /></div>
      <div class="field"><label class="field-label">过期时间</label><input class="input" id="cExp" value="${esc(c.expiresAt)}" placeholder="2026-12-31" /></div>
    </div>
    <label class="switch"><input type="checkbox" id="cActive" ${c.active ? 'checked' : ''}/> 启用该券</label>`, async () => {
    c.code = document.getElementById('cCode').value.trim();
    c.name = document.getElementById('cName').value.trim();
    c.type = document.getElementById('cType').value;
    c.value = Number(document.getElementById('cValue').value) || 0;
    c.minSpend = Number(document.getElementById('cMin').value) || 0;
    c.level = document.getElementById('cLevel').value;
    c.total = Number(document.getElementById('cTotal').value) || 0;
    c.expiresAt = document.getElementById('cExp').value.trim();

    if (r.ok) { mask.classList.remove('show'); XJ.toast('折扣券已保存'); loadCoupons(); }
  });
}

    };
    if (!patch.aiApiKey) delete patch.aiApiKey; /* 留空表示不修改 */
    const r = await api('/api/admin/config', { method: 'POST', body: JSON.stringify({ config: patch }) });
    if (r.ok) {
      XJ.toast('XJ AI 配置已保存并生效');
      CONFIG = Object.assign({}, CONFIG, patch);
      document.getElementById('aiKey').value = '';
    }
  });

  /* AI 总开关 + 逐模型开关：aiEnabled 控制整个 XJ AI，aiDisabledModels 记录被停用的模型 */
  document.getElementById('aiSwitchSave').addEventListener('click', async () => {
    const enabled = document.getElementById('aiEnabled').checked;
    const disabled = [];
    document.querySelectorAll('#aiModelSwitches input[data-aimodel]').forEach(chk => {
      if (!chk.checked) disabled.push(chk.getAttribute('data-aimodel'));
    });
    const patch = { aiEnabled: enabled, aiDisabledModels: disabled.join(',') };
    const r = await api('/api/admin/config', { method: 'POST', body: JSON.stringify({ config: patch }) });
    if (r.ok) {
      XJ.toast('AI 开关已保存并实时生效' + (enabled ? '' : '（XJ AI 已关闭）'));
      CONFIG = Object.assign({}, CONFIG, patch);
    } else {
      XJ.toast('保存失败：' + (r.msg || '未知错误'));
    }
  });
}

      </div>
      <div class="grid2">
        <div class="field"><label class="field-label">商户号 PID</label><input class="input" id="cPid" value="${esc(c.pid)}" /></div>
        <div class="field"><label class="field-label">站点名称</label><input class="input" id="cSite" value="${esc(c.sitename)}" /></div>
      </div>

        <div class="field"><label class="field-label">签名方式</label><select class="input" id="cSign">
          <option value="MD5" ${c.signType === 'MD5' ? 'selected' : ''}>MD5（签名 32 位）</option>
          <option value="RSA" ${c.signType === 'RSA' ? 'selected' : ''}>RSA（签名 344 位，需后台开通）</option>
        </select><div class="hint">若网关提示「sign 超过最大长度 32」，说明该商户只支持 MD5</div></div>
        <div class="field"><label class="field-label">RSA 算法</label><select class="input" id="cAlgo">
          <option value="RSA-SHA256" ${c.rsaAlgo === 'RSA-SHA256' ? 'selected' : ''}>RSA-SHA256</option>
          <option value="RSA-SHA1" ${c.rsaAlgo === 'RSA-SHA1' ? 'selected' : ''}>RSA-SHA1</option>
        </select></div>
      </div>
      <div class="field"><label class="field-label">MD5 加签密钥</label><input class="input" id="cKey" type="password" value="" placeholder="${c.keySet ? '已配置（留空表示不修改）' : '尚未配置，请输入密钥'}" autocomplete="off" /><div class="hint">仅保存在服务端，不回传到浏览器；留空则保持原密钥不变，提交后即时生效无需重启</div></div>
      <div class="grid2">
        <div class="field"><label class="field-label">异步回调地址 notify_url</label><input class="input" id="cNotify" value="${esc(c.notifyUrl)}" placeholder="留空则自动用当前站点地址" /></div>
        <div class="field"><label class="field-label">同步返回地址 return_url</label><input class="input" id="cReturn" value="${esc(c.returnUrl)}" placeholder="留空则跳回订单页" /></div>
      </div>
      <label class="switch"><input type="checkbox" id="cMock" ${c.mock ? 'checked' : ''}/> 本地演练模式（不请求真实网关，直接标记已支付）</label>
      <div class="modal-foot" style="justify-content:flex-start">
        <button class="btn btn-primary" id="cSave">保存配置</button>
        <button class="btn btn-outline" id="cPing">测试连接</button>
      </div>
      <div class="hint" id="cState"></div>
    </div>`;
  document.getElementById('cSave').addEventListener('click', async () => {
    const patch = {
      apiBase: document.getElementById('cApi').value.trim(), submitPath: document.getElementById('cPath').value.trim(),
      pid: document.getElementById('cPid').value.trim(), sitename: document.getElementById('cSite').value.trim(),
      signType: document.getElementById('cSign').value, rsaAlgo: document.getElementById('cAlgo').value,
      key: document.getElementById('cKey').value.trim(), notifyUrl: document.getElementById('cNotify').value.trim(),
      returnUrl: document.getElementById('cReturn').value.trim(), mock: document.getElementById('cMock').checked,
    };
    /* 密钥留空表示「不修改」，避免误清空已配置的加签密钥 */
    if (!patch.key) delete patch.key;
    const r = await api('/api/admin/config', { method: 'POST', body: JSON.stringify({ config: patch }) });
    if (r.ok) {
      XJ.toast('配置已保存并生效');
      CONFIG = Object.assign({}, CONFIG, patch);
      document.getElementById('cKey').value = '';
    }
  });
  document.getElementById('cPing').addEventListener('click', async () => {
    const r = await fetch('/api/ping').then(x => x.json());
    document.getElementById('cState').innerHTML =
      `当前生效：签名 <b>${r.signType}</b> ｜ 商户号 <b>${r.pid}</b> ｜ 网关 <b>${r.apiBase}</b> ｜ ` +
      `MD5 密钥 ${r.md5KeySet ? '已配置' : '未配置'} ｜ 私钥 ${r.privateKeySet ? '已加载' : '未加载'} ｜ ` +
      `平台公钥 ${r.gatewayPublicKeySet ? '已加载' : '未加载'} ｜ 演练模式 ${r.mock ? '开' : '关'}`;
  });
}

/* =========================================================
   10. 账户安全（保留）
   ========================================================= */
function renderAccount() {
  document.getElementById('tab-account').innerHTML = `
    <div class="card panel-card anim-up" style="max-width:460px">
      <div class="section-title">修改管理员密码</div>
      <div class="field"><label class="field-label">原密码</label><input class="input" id="pOld" type="password" /></div>
      <div class="field"><label class="field-label">新密码</label><input class="input" id="pNew" type="password" placeholder="至少 6 位" /></div>
      <div class="field"><label class="field-label">确认新密码</label><input class="input" id="pNew2" type="password" /></div>
      <button class="btn btn-primary" id="pSave">保存</button>
      <div class="hint" style="margin-top:14px">管理员账号固定为「星际Stellar」，不可修改。修改密码后需要重新登录。</div>
    </div>`;
  document.getElementById('pSave').addEventListener('click', async () => {
    const oldPass = document.getElementById('pOld').value, newPass = document.getElementById('pNew').value, newPass2 = document.getElementById('pNew2').value;
    if (newPass !== newPass2) { XJ.toast('两次输入的新密码不一致'); return; }
    try {
      const r = await api('/api/admin/password', { method: 'POST', body: JSON.stringify({ oldPass, newPass }) });
      if (r.ok) { XJ.toast(r.msg || '已更新'); setTimeout(logout, 800); }
    } catch (e) {}
  });
}
