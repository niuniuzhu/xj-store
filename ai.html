<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>XJ AI · 智能助手</title>
<script src="assets/head.js"></script>
<link rel="stylesheet" href="assets/base.css" />
<style>
  /* ============ 布局：左侧会话列表 + 右侧对话区 ============ */
  body { overflow: hidden; } /* 聊天页自身滚动，不整页滚动 */
  #page { flex: 1 0 auto; min-height: 0; }

  .ai-shell {
    width: 100%; max-width: min(var(--page-w), 100% - 32px);
    margin: 0 auto; padding: 14px 22px 16px;
    height: calc(100vh - var(--header-h));
    height: calc(100dvh - var(--header-h));
    display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 14px;
  }

  /* ---------- 左侧 ---------- */
  .ai-side {
    display: flex; flex-direction: column; gap: 12px; min-height: 0;
    background: var(--surface); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card); padding: 14px 12px;
  }
  .new-chat {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    height: 42px; border-radius: var(--radius); font-size: 14px; font-weight: 600;
    color: #fff; background: linear-gradient(135deg, #6a5cff, #2b6df6 60%, #35c6f4);
    box-shadow: 0 3px 12px rgba(58, 104, 246, .3); transition: filter .15s, transform .15s;
  }
  .new-chat:hover { filter: brightness(1.06); }
  .new-chat:active { transform: translateY(1px); }
  .new-chat svg { width: 16px; height: 16px; }

  .side-label {
    font-size: 12px; color: var(--text-3); padding: 2px 6px 0;
    display: flex; align-items: center; justify-content: space-between;
  }
  .conv-list { flex: 1; overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 3px; padding-right: 2px; }
  .conv-list::-webkit-scrollbar { width: 6px; }
  .conv-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .conv {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 9px 10px; border-radius: 9px; color: var(--text-2); font-size: 13.5px;
    transition: background .15s, color .15s; position: relative;
  }
  .conv:hover { background: var(--surface-2); color: var(--text); }
  .conv.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
  .conv .c-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .conv .c-del {
    width: 20px; height: 20px; display: none; place-items: center; border-radius: 5px;
    color: var(--text-3); flex-shrink: 0;
  }
  .conv:hover .c-del { display: grid; }
  .conv .c-del:hover { background: rgba(245, 34, 45, .12); color: var(--red); }
  .conv .c-del svg { width: 13px; height: 13px; }
  .side-foot { flex-shrink: 0; font-size: 11.5px; color: var(--text-3); line-height: 1.5; padding: 8px 6px 2px; border-top: 1px dashed var(--border); }

  /* ---------- 右侧 ---------- */
  .ai-main {
    display: flex; flex-direction: column; min-height: 0; position: relative;
    background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
    overflow: hidden;
  }
  .chat-top {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .ai-orb {
    width: 34px; height: 34px; border-radius: 11px; flex-shrink: 0;
    background: linear-gradient(135deg, #6a5cff, #2b6df6 55%, #35c6f4);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 3px 10px rgba(58, 104, 246, .35);
  }
  .ai-orb svg { width: 19px; height: 19px; }
  .chat-title .t1 { font-size: 15px; font-weight: 700; line-height: 1.3; }
  .chat-title .t2 { font-size: 12px; color: var(--text-3); line-height: 1.3; }
  .chat-tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .model-pick {
    position: relative; display: flex; align-items: center;
    border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
    padding: 0 8px 0 10px; height: 34px; transition: border-color .15s;
  }
  .model-pick:hover, .model-pick:focus-within { border-color: var(--primary); }
  .model-pick svg { width: 14px; height: 14px; color: var(--text-3); flex-shrink: 0; }
  .model-pick select {
    appearance: none; border: none; outline: none; background: transparent;
    color: var(--text); font-size: 13px; padding: 0 18px 0 6px; height: 100%;
    cursor: pointer; max-width: 168px;
  }
  .model-pick::after {
    content: ""; position: absolute; right: 9px; top: 50%; width: 6px; height: 6px;
    border-right: 1.6px solid var(--text-3); border-bottom: 1.6px solid var(--text-3);
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }

  .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
  .chat-scroll::-webkit-scrollbar { width: 8px; }
  .chat-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
  .chat-inner { max-width: 860px; margin: 0 auto; padding: 22px 22px 10px; }

  /* ---------- 空态 ---------- */
  .empty { text-align: center; padding: 8vh 12px 0; }
  .empty .orb {
    width: 62px; height: 62px; border-radius: 20px; margin: 0 auto 18px;
    background: linear-gradient(135deg, #6a5cff, #2b6df6 55%, #35c6f4);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 10px 28px rgba(58, 104, 246, .38);
  }
  .empty .orb svg { width: 32px; height: 32px; }
  .empty h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: .2px; }
  .empty p { margin: 0; color: var(--text-3); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 24px auto 0; max-width: 470px; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 11px; background: var(--surface);
    font-size: 13px; color: var(--text-2); transition: all .15s; text-align: left;
  }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }
  .chip svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ---------- 消息 ---------- */
  .msg { display: flex; gap: 10px; margin-bottom: 20px; animation: msgIn .22s ease both; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg .ava {
    width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; margin-top: 2px;
    display: grid; place-items: center; font-size: 12px; font-weight: 700; color: #fff;
  }
  .msg.ai .ava { background: linear-gradient(135deg, #6a5cff, #2b6df6 55%, #35c6f4); }
  .msg.ai .ava svg { width: 17px; height: 17px; }
  .msg.you .ava { background: var(--text-2); }
  .msg .body { min-width: 0; flex: 1; }
  .msg.you { flex-direction: row-reverse; }
  .msg.you .body { display: flex; justify-content: flex-end; }
  .msg.you .bubble {
    background: var(--primary); color: #fff; border-color: transparent;
    border-radius: 14px 14px 4px 14px; max-width: 82%;
  }
  .bubble {
    display: inline-block; max-width: 100%; padding: 11px 15px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px 14px 14px 4px;
    font-size: 14px; line-height: 1.72; word-break: break-word; overflow-wrap: anywhere;
  }
  .msg.you .bubble { white-space: pre-wrap; }
  .msg.err .bubble { background: var(--tag-red-bg); border-color: rgba(245, 34, 45, .25); color: var(--tag-red-fg); }

  /* 等待首字：三点呼吸 */
  .thinking { display: flex; align-items: center; gap: 5px; height: 22px; }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--text-3); animation: blink 1.1s infinite; }
  .thinking i:nth-child(2) { animation-delay: .16s; }
  .thinking i:nth-child(3) { animation-delay: .32s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }

  /* 流式光标 */
  .cursor { display: inline-block; width: 7px; height: 15px; margin-left: 2px; vertical-align: -2px;
    background: var(--primary); border-radius: 2px; animation: caret .9s steps(2) infinite; }
  @keyframes caret { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  /* ---------- Markdown 排版 ---------- */
  .md > *:first-child { margin-top: 0; }
  .md > *:last-child { margin-bottom: 0; }
  .md p { margin: 0 0 10px; }
  .md h3, .md h4, .md h5, .md h6 { margin: 16px 0 8px; line-height: 1.4; }
  .md h3 { font-size: 17px; } .md h4 { font-size: 15.5px; } .md h5 { font-size: 14.5px; }
  .md ul, .md ol { margin: 0 0 10px; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md blockquote {
    margin: 0 0 10px; padding: 6px 12px; border-left: 3px solid var(--border-strong);
    color: var(--text-2); background: var(--surface); border-radius: 0 8px 8px 0;
  }
  .md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .md a { color: var(--primary); text-decoration: underline; text-underline-offset: 2px; }
  .md code.ic {
    padding: 1.5px 5px; border-radius: 5px; font-size: 12.8px;
    background: rgba(43, 109, 246, .1); color: var(--primary);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .md .code {
    margin: 10px 0 12px; border-radius: 11px; overflow: hidden;
    border: 1px solid var(--border); background: #1b1e26;
  }
  .md .code-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; background: #22262f; color: #9aa4b6; font-size: 11.5px;
    border-bottom: 1px solid #2c313c;
  }
  .md .code-head .lang { text-transform: uppercase; letter-spacing: .6px; }
  .code-copy {
    padding: 3px 9px; border-radius: 6px; font-size: 11.5px; color: #c9d1de;
    background: rgba(255, 255, 255, .07); transition: background .15s, color .15s;
  }
  .code-copy:hover { background: rgba(255, 255, 255, .16); color: #fff; }
  .md pre { margin: 0; padding: 12px 14px; overflow-x: auto; }
  .md pre code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.8px; line-height: 1.65; color: #e6e9f0; white-space: pre;
  }
  .md pre::-webkit-scrollbar { height: 8px; }
  .md pre::-webkit-scrollbar-thumb { background: #3a4150; border-radius: 4px; }
  .md table { border-collapse: collapse; margin: 8px 0 12px; font-size: 13px; }
  .md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }

  /* 消息操作条 */
  .msg-acts { display: flex; gap: 6px; margin-top: 6px; opacity: 0; transition: opacity .15s; }
  .msg:hover .msg-acts { opacity: 1; }
  .msg-act {
    display: flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 6px;
    font-size: 11.8px; color: var(--text-3); background: transparent;
  }
  .msg-act:hover { background: var(--surface-2); color: var(--text-2); }
  .msg-act svg { width: 12px; height: 12px; }

  /* ---------- 输入区 ---------- */
  .composer { flex-shrink: 0; padding: 8px 18px 16px; }
  .composer-box {
    max-width: 860px; margin: 0 auto;
    border: 1.5px solid var(--border); border-radius: 16px; background: var(--surface);
    padding: 10px 12px 8px; transition: border-color .15s, box-shadow .15s;
    box-shadow: var(--shadow-card);
  }
  .composer-box:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(43, 109, 246, .12); }
  #input {
    width: 100%; border: none; outline: none; background: transparent; resize: none;
    color: var(--text); font-size: 14.5px; line-height: 1.6; max-height: 168px;
    padding: 2px 2px 6px; display: block;
  }
  #input::placeholder { color: var(--text-3); }
  .composer-bar { display: flex; align-items: center; gap: 10px; }
  .composer-hint { font-size: 11.5px; color: var(--text-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer-hint.warn { color: var(--tag-orange-fg); }
  .send-btn {
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 16px;
    border-radius: 9px; font-size: 13.5px; font-weight: 600; color: #fff;
    background: linear-gradient(135deg, #6a5cff, #2b6df6 60%, #35c6f4);
    box-shadow: 0 3px 10px rgba(58, 104, 246, .28); transition: filter .15s, opacity .15s;
  }
  .send-btn:hover { filter: brightness(1.06); }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; filter: none; box-shadow: none; }
  .send-btn svg { width: 15px; height: 15px; }
  .send-btn.stop { background: var(--text-2); box-shadow: none; }

  /* ---------- 附件（图片 / 文档） ---------- */
  .attach-btn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px;
    color: var(--text-2); flex-shrink: 0; transition: background .15s, color .15s, transform .15s;
  }
  .attach-btn:hover { background: var(--surface-2); color: var(--primary); transform: translateY(-1px); }
  .attach-btn:active { transform: scale(.92); }
  .attach-btn svg { width: 18px; height: 18px; }
  .att-previews { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 2px 8px; }
  .att-previews:empty { display: none; }
  .att-item {
    position: relative; display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 8px;
    border-radius: 9px; background: var(--surface-2); border: 1px solid var(--border); max-width: 210px;
    animation: attIn .18s ease both;
  }
  @keyframes attIn { from { opacity: 0; transform: translateY(4px) scale(.96); } to { opacity: 1; transform: none; } }
  .att-item img { width: 34px; height: 34px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .att-item .att-ico { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 6px; background: var(--primary-soft); color: var(--primary); flex-shrink: 0; font-size: 16px; }
  .att-item .att-name { font-size: 12.5px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .att-item .att-x {
    position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%;
    background: var(--text-2); color: #fff; display: grid; place-items: center; font-size: 11px; line-height: 1;
    box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
  }
  .att-item .att-x:hover { background: var(--red); }

  /* 用户消息里的图片 / 文档 */
  .msg.you .bubble.u-rich { display: flex; flex-direction: column; gap: 8px; max-width: 84%; padding: 8px; }
  .msg.you .u-img { max-width: 240px; max-height: 240px; border-radius: 10px; display: block; }
  .msg.you .u-doc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); background: rgba(255, 255, 255, .18); padding: 7px 10px; border-radius: 8px; }

  /* ---------- 按钮动画 ---------- */
  @keyframes aiOrbFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .ai-orb { animation: aiOrbFloat 4s ease-in-out infinite; }
  @keyframes sendPop { 0% { transform: scale(1); } 50% { transform: scale(.94); } 100% { transform: scale(1); } }
  .send-btn:hover { filter: brightness(1.06); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(58, 104, 246, .4); }
  .send-btn:hover svg { transform: translateX(2px) rotate(-8deg); transition: transform .2s; }
  .send-btn:active { animation: sendPop .22s ease; }
  .send-btn.stop { animation: stopPulse 1.4s ease-in-out infinite; }
  @keyframes stopPulse { 0%, 100% { box-shadow: 0 3px 10px rgba(58, 104, 246, .28); } 50% { box-shadow: 0 3px 16px rgba(120, 120, 140, .5); } }
  .new-chat { position: relative; overflow: hidden; }
  .new-chat::after {
    content: ""; position: absolute; top: 0; left: -120%; width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
    transform: skewX(-18deg); pointer-events: none;
  }
  .new-chat:hover::after { animation: shine .8s ease; }
  @keyframes shine { to { left: 140%; } }
  .chat-top .icon-btn {
    width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px;
    color: var(--text-2); transition: background .15s, color .15s, transform .15s;
  }
  .chat-top .icon-btn:hover { background: var(--surface-2); color: var(--text); transform: translateY(-1px); }
  .chat-top .icon-btn:active { transform: scale(.9); }
  .msg-act { transition: background .15s, color .15s, transform .15s; }
  .msg-act:hover { background: var(--surface-2); color: var(--text-2); transform: translateY(-1px); }
  .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(43, 109, 246, .16); }

  /* 聊天页不需要「回到顶部 / 公告铃铛」浮层，避免压住输入区 */
  #toTop, .announce-bell { display: none !important; }

  /* 手机端补一个「新对话」按钮（侧栏此时不可见） */
  .only-mobile { display: none; }
  html.mobile-layout .only-mobile { display: grid; }
  /* 真机上已是手机排版，无需再切；桌面预览时保留该按钮 */
  html.mobile-layout #mobileBtn { display: none; }
  html.mobile-mode #mobileBtn { display: grid; }

  /* ---------- 玻璃质感下提高可读性：聊天区/气泡/输入框用更实的底色 ---------- */
  .glass-mode .ai-main, .glass-mode .ai-side,
  .glass-mode .composer-box, .glass-mode .model-pick, .glass-mode .chip,
  .glass-mode .bubble {
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    backdrop-filter: blur(26px) saturate(170%);
  }
  html.glass-mode .ai-main, html.glass-mode .ai-side { background: rgba(255, 255, 255, .82); }
  html.glass-mode .bubble,
  html.glass-mode .composer-box,
  html.glass-mode .model-pick,
  html.glass-mode .chip { background: rgba(255, 255, 255, .88); }
  html[data-theme="dark"].glass-mode .ai-main,
  html[data-theme="dark"].glass-mode .ai-side { background: rgba(30, 32, 38, .80); }
  html[data-theme="dark"].glass-mode .bubble,
  html[data-theme="dark"].glass-mode .composer-box,
  html[data-theme="dark"].glass-mode .model-pick,
  html[data-theme="dark"].glass-mode .chip { background: rgba(44, 46, 54, .84); }
  /* 用户气泡保持主色，不受上面覆盖影响 */
  html.glass-mode .msg.you .bubble,
  html[data-theme="dark"].glass-mode .msg.you .bubble { background: var(--primary); }

  /* ---------- 手机 / 窄屏 ----------
     html.mobile-layout 由 assets/head.js 在窄屏时自动打类，
     桌面端点「手机」按钮预览时同样生效，两种场景排版完全一致。 */
  html.mobile-layout .ai-shell { grid-template-columns: minmax(0, 1fr); padding: 10px 10px 8px; gap: 0; }
  html.mobile-layout .ai-side { display: none; }
  html.mobile-layout .chat-inner { padding: 16px 12px 6px; }
  html.mobile-layout .composer { padding: 6px 10px 10px; }
  html.mobile-layout .chat-top { padding: 10px 12px; }
  html.mobile-layout .model-pick select { max-width: 104px; }
  html.mobile-layout .empty { padding-top: 5vh; }
  html.mobile-layout .msg.you .bubble { max-width: 90%; }
  html.mobile-layout .chat-tools { gap: 4px; }
  /* 权限徽章在窄屏占位过多（VIP+管理员合计 ~180px），会挤掉右侧按钮 */
  html.mobile-layout .perm-badge { display: none !important; }
  html.mobile-layout .chat-title { min-width: 0; }
  html.mobile-layout .chat-title .t1 { font-size: 15px; }
  html.mobile-layout .chat-title .t2 { font-size: 11.5px; }

  /* ---------- 权限门禁（未登录 / 等级不足） ---------- */
  .gate {
    position: absolute; inset: 0; z-index: 20; display: none;
    place-items: center; padding: 24px; text-align: center;
    background: var(--surface); border-radius: var(--radius-lg);
  }
  .gate.show { display: grid; }
  .gate-inner { max-width: 420px; }
  .gate .g-orb {
    width: 58px; height: 58px; border-radius: 18px; margin: 0 auto 16px;
    background: linear-gradient(135deg, #ff9f43, #f97316);
    display: grid; place-items: center; color: #fff;
    box-shadow: 0 10px 26px rgba(249, 115, 22, .32);
  }
  .gate .g-orb svg { width: 28px; height: 28px; }
  .gate h3 { margin: 0 0 8px; font-size: 19px; font-weight: 800; }
  .gate p { margin: 0 0 6px; color: var(--text-3); font-size: 13.5px; line-height: 1.7; }
  .gate .g-level { display: inline-flex; align-items: center; gap: 6px; margin: 12px 0 4px; }
  .gate .g-badge {
    padding: 4px 11px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff;
  }
  .gate .g-act { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
  .gate .g-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 18px;
    border-radius: 10px; font-size: 13.5px; font-weight: 600; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-2); transition: all .15s;
  }
  .gate .g-btn:hover { border-color: var(--primary); color: var(--primary); transform: translateY(-1px); }
  .gate .g-btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, #6a5cff, #2b6df6 60%, #35c6f4); }
  .gate .g-btn.primary:hover { filter: brightness(1.06); color: #fff; }
  .gate .g-btn svg { width: 15px; height: 15px; }

  /* ---------- 权限徽章（顶栏） ---------- */
  .perm-badge {
    display: none; align-items: center; gap: 5px; height: 30px; padding: 0 11px;
    border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .perm-badge.show { display: inline-flex; }
  .perm-badge svg { width: 13px; height: 13px; }
  .perm-badge.vip { background: rgba(139, 92, 246, .12); color: #8b5cf6; border: 1px solid rgba(139, 92, 246, .25); }
  .perm-badge.admin { background: linear-gradient(135deg, #f59e0b, #f97316); color: #fff; box-shadow: 0 3px 10px rgba(245, 158, 11, .3); }
  html[data-theme="dark"] .perm-badge.vip { background: rgba(139, 92, 246, .2); color: #c4b5fd; }

  /* ---------- 商品卡片（AI 推荐结果） ---------- */
  .md .prod-ref {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
    border-radius: 8px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    background: rgba(43, 109, 246, .1); color: var(--primary); border: 1px solid rgba(43, 109, 246, .2);
    text-decoration: none; transition: all .15s;
  }
  .md .prod-ref:hover { background: var(--primary); color: #fff; border-color: transparent; }

  .prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin: 12px 0; }
  .prod-card {
    display: flex; flex-direction: column; gap: 8px; padding: 12px;
    border: 1px solid var(--border); border-radius: 13px; background: var(--surface-2);
    transition: transform .15s, box-shadow .15s, border-color .15s;
  }
  .prod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); border-color: var(--primary); }
  .prod-card .pc-top { display: flex; align-items: center; gap: 9px; }
  .prod-card .pc-emoji {
    width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: grid; place-items: center;
    font-size: 17px; background: var(--surface); border: 1px solid var(--border);
  }
  .prod-card .pc-name { font-size: 13.5px; font-weight: 700; line-height: 1.35; }
  .prod-card .pc-cat { font-size: 11.5px; color: var(--text-3); }
  .prod-card .pc-price { display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .prod-card .pc-now { font-size: 16px; font-weight: 800; color: var(--primary); }
  .prod-card .pc-old { font-size: 11.5px; color: var(--text-3); text-decoration: line-through; }
  .prod-card .pc-reason { font-size: 11.5px; color: var(--text-3); line-height: 1.55; }
  .prod-card .pc-acts { display: flex; gap: 7px; margin-top: auto; }
  .prod-card .pc-btn {
    flex: 1; height: 30px; border-radius: 8px; font-size: 12.5px; font-weight: 600;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; transition: all .15s;
  }
  .prod-card .pc-btn:hover { border-color: var(--primary); color: var(--primary); }
  .prod-card .pc-btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, #6a5cff, #2b6df6 60%, #35c6f4); }
  .prod-card .pc-btn.primary:hover { color: #fff; filter: brightness(1.06); }
  .prod-card .pc-btn svg { width: 13px; height: 13px; }

  /* ---------- 推荐面板（侧栏） ---------- */
  .rec-panel { border-top: 1px dashed var(--border); padding-top: 10px; }
  .rec-head { display: flex; align-items: center; justify-content: space-between; padding: 0 6px 8px; }
  .rec-head .rec-t { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 5px; }
  .rec-head .rec-t svg { width: 13px; height: 13px; color: var(--primary); }
  .rec-head .rec-refresh {
    background: transparent; border: none; color: var(--text-3); cursor: pointer; font-size: 11.5px;
    display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px; border-radius: 6px; transition: all .15s;
  }
  .rec-head .rec-refresh:hover { color: var(--primary); background: var(--primary-soft); }
  .rec-head .rec-refresh svg { width: 12px; height: 12px; }
  .rec-list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; max-height: 260px; }
  .rec-list::-webkit-scrollbar { width: 5px; }
  .rec-list::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
  .rec-item {
    display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); cursor: pointer; transition: all .15s;
  }
  .rec-item:hover { border-color: var(--primary); transform: translateX(2px); }
  .rec-item .ri-emoji {
    width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
    font-size: 15px; background: var(--surface-2);
  }
  .rec-item .ri-body { min-width: 0; flex: 1; }
  .rec-item .ri-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rec-item .ri-price { font-size: 11.5px; color: var(--primary); font-weight: 700; }
  .rec-item .ri-price .ri-old { color: var(--text-3); text-decoration: line-through; font-weight: 400; margin-left: 5px; }

  /* ---------- 智能功能快捷入口 ---------- */
  .smart-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .smart-btn {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border-radius: 999px; font-size: 12.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--text-2); transition: all .15s;
  }
  .smart-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); transform: translateY(-1px); }
  .smart-btn svg { width: 14px; height: 14px; }
  .smart-btn.gold { border-color: rgba(245, 158, 11, .35); color: #f59e0b; background: rgba(245, 158, 11, .08); }
  .smart-btn.gold:hover { background: rgba(245, 158, 11, .16); color: #d97706; }

  @media (prefers-reduced-motion: reduce) {
    .ai-orb { animation: none; }
    .send-btn.stop { animation: none; }
    .send-btn:hover { transform: none; }
    .new-chat::after { display: none; }
    .chat-top .icon-btn:hover, .msg-act:hover, .chip:hover { transform: none; }
    .prod-card:hover, .rec-item:hover, .smart-btn:hover { transform: none; }
  }
</style>
</head>
<body>

<div id="header"></div>

<div id="page">
  <div class="ai-shell">
    <!-- 左侧会话列表 -->
    <aside class="ai-side">
      <button class="new-chat" id="newChat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>新对话</span>
      </button>
      <div class="side-label"><span>最近对话</span></div>
      <div class="conv-list" id="convList"></div>
      <div class="rec-panel" id="recPanel" style="display:none">
        <div class="rec-head">
          <span class="rec-t" id="recTitle">为你推荐</span>
          <button class="rec-refresh" id="recRefresh" type="button" title="换一批">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>
            换一批
          </button>
        </div>
        <div class="rec-list" id="recList"></div>
      </div>
      <div class="side-foot">由 XJ AI 代理转发，密钥仅保存在服务端。</div>
    </aside>

    <!-- 右侧对话区 -->
    <section class="ai-main">
      <!-- 权限门禁：未登录 / 等级不足时覆盖整个对话区 -->
      <div class="gate" id="gate">
        <div class="gate-inner">
          <div class="g-orb" id="gateOrb"></div>
          <h3 id="gateTitle">XJ AI 为 VIP 及以上会员专享</h3>
          <p id="gateDesc">登录会员账号后即可使用商店智能助手。</p>
          <div class="g-level" id="gateLevelWrap" style="display:none">
            <span class="g-badge" id="gateLevel">未登录</span>
            <span class="g-badge" id="gateNeed" style="background:linear-gradient(135deg,#6a5cff,#2b6df6)">VIP</span>
          </div>
          <div class="g-act">
            <a class="g-btn primary" href="login.html?back=ai.html" id="gateLogin">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg>
              登录会员账号
            </a>
            <a class="g-btn" href="redeem.html" id="gateRedeem">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 8h18M12 8v13M12 8S9 3 7.5 4.5 9.5 8 12 8z"/><path d="M12 8s3-5 4.5-3.5S14.5 8 12 8z"/></svg>
              兑换会员卡密
            </a>
          </div>
        </div>
      </div>

      <div class="chat-top">
        <div class="ai-orb" id="orb"></div>
        <div class="chat-title">
          <div class="t1">XJ AI</div>
          <div class="t2" id="modelHint">正在读取模型…</div>
        </div>
        <div class="chat-tools">
          <span class="perm-badge vip" id="permVip" title="XJ AI 使用权限"></span>
          <span class="perm-badge admin" id="permAdmin" title="XJ AI 最高权限：可查看经营数据"></span>
          <div class="model-pick" title="切换模型">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
            <select id="modelSel"></select>
          </div>
          <button class="icon-btn only-mobile" id="newChatM" title="新对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="icon-btn" id="mobileBtn" title="切换手机端">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
          </button>
          <button class="icon-btn" id="clearBtn" title="清空当前对话">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l.8 13h9.4l.8-13"/><path d="M10.5 11v6M13.5 11v6"/></svg>
          </button>
        </div>
      </div>

      <div class="chat-scroll" id="scroll">
        <div class="chat-inner" id="msgs"></div>
      </div>

      <div class="composer">
        <div class="composer-box">
          <div class="att-previews" id="attPrev"></div>
          <textarea id="input" rows="1" placeholder="给 XJ AI 发消息，或上传图片 / 文档…（Enter 发送，Shift + Enter 换行）"></textarea>
          <div class="composer-bar">
            <button class="attach-btn" id="attachBtn" type="button" title="上传图片或文档">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5 12.5 20a5 5 0 0 1-7-7l8.5-8.5a3.3 3.3 0 0 1 4.7 4.7l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.8-7.8"/></svg>
            </button>
            <input type="file" id="attInput" accept="image/*,.txt,.md,.markdown,.json,.csv,.tsv,.log,.xml,.js,.ts,.py,.html,.css,.yml,.yaml,.toml,.ini,.conf" multiple hidden />
            <span class="composer-hint" id="hint">内容由 AI 生成，请自行核对</span>
            <button class="send-btn" id="sendBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 12h13M11 5l7 7-7 7"/></svg>
              <span id="sendLabel">发送</span>
            </button>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>

<script src="assets/base.js"></script>
<script>
(function () {
  'use strict';

  /* ================= 常量与状态 ================= */
  const CONV_KEY = 'xj_ai_convs';
  const MODEL_KEY = 'xj_ai_model';
  const MAX_CONV = 30;

  const state = {
    convs: [],
    curId: '',
    model: '',
    models: [],
    defaultModel: '',
    streaming: false,
    abort: null,
    lastModel: '',
    draftFiles: [],
    /* 权限态 */
    access: { allowed: false, msg: '', needLevel: 'vip', level: '', levelName: '', isAdmin: false },
    products: [],
    recs: [],
  };

  const $ = id => document.getElementById(id);
  const elMsgs = $('msgs'), elScroll = $('scroll'), elInput = $('input');
  const elSend = $('sendBtn'), elSendLabel = $('sendLabel'), elModel = $('modelSel');
  const elHint = $('hint'), elModelHint = $('modelHint'), elConvList = $('convList');
  const elGate = $('gate');

  const ICON = {
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M11 3.2l1.85 5.05L17.9 10.1l-5.05 1.85L11 17l-1.85-5.05L4.1 10.1l5.05-1.85z"/><path d="M18.4 14.6l.85 2.35 2.35.85-2.35.85-.85 2.35-.85-2.35-2.35-.85 2.35-.85z"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 5.5A1.5 1.5 0 0 0 13.5 4H5.5A1.5 1.5 0 0 0 4 5.5v8A1.5 1.5 0 0 0 5.5 15"/></svg>',
    retry: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M9.5 7V5h5v2M7 7l.7 12h8.6L17 7"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H9l-4 3.5V16H6a2 2 0 0 1-2-2z"/></svg>',
    lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4.5" y="10" width="15" height="10" rx="2.5"/><path d="M8 10V7.5a4 4 0 0 1 8 0V10"/></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/></svg>',
    cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 7H6"/></svg>',
    eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg>',
    chart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8h18M12 8v13M12 8S9 3 7.5 4.5 9.5 8 12 8z"/><path d="M12 8s3-5 4.5-3.5S14.5 8 12 8z"/></svg>',
  };

  /* ================= 本地存储 ================= */
  function loadConvs() {
    try {
      const raw = JSON.parse(localStorage.getItem(CONV_KEY) || '[]');
      return Array.isArray(raw) ? raw.filter(c => c && c.id && Array.isArray(c.messages)) : [];
    } catch (e) { return []; }
  }
  /* 持久化时把多模态内容降为纯文本（图片不入库，避免打爆 localStorage 配额）
     注意：商品卡片（cards）必须一起存，否则刷新后推荐卡片会消失 */
  function msgToText(c) {
    if (typeof c === 'string') return c;
    if (Array.isArray(c)) {
      return c.map(p => p.type === 'text' ? (p.text || '') : p.type === 'image_url' ? '【图片】' : p.type === 'file' ? ('【文档】' + (p.name || '')) : '').join('\n');
    }
    return String(c == null ? '' : c);
  }
  /* 卡片只保留渲染需要的字段，避免把整份商品对象塞进 localStorage */
  function cardToLite(p) {
    if (!p) return null;
    return {
      id: p.id, title: p.title || '', emoji: p.emoji || '', color: p.color || '',
      cat: p.cat || '', catName: p.catName || '', price: Number(p.price) || 0,
      memberPrice: p.memberPrice == null ? undefined : Number(p.memberPrice),
      stock: p.stock == null ? undefined : Number(p.stock),
      reason: p.reason || '',
    };
  }
  function saveConvs() {
    try {
      const data = state.convs.slice(0, MAX_CONV).map(c => ({
        id: c.id, title: c.title, at: c.at,
        messages: c.messages.map(m => {
          const o = { role: m.role, content: msgToText(m.content) };
          if (m.cards && m.cards.length) o.cards = m.cards.map(cardToLite).filter(Boolean);
          return o;
        }),
      }));
      localStorage.setItem(CONV_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function curConv() {
    let c = state.convs.find(x => x.id === state.curId);
    /* 兜底：curId 失效（换设备/清缓存/会话被删）时回落到首个会话，避免消息写进虚空 */
    if (!c) {
      c = state.convs[0] || null;
      state.curId = c ? c.id : '';
    }
    return c;
  }
  function newConv() {
    const c = { id: 'c' + Date.now().toString(36), title: '新对话', at: Date.now(), messages: [] };
    state.convs.unshift(c);
    state.curId = c.id;
    saveConvs();
    return c;
  }

  /* ================= 权限与登录态 ================= */
  function me() {
    try { return JSON.parse(localStorage.getItem('xj_user') || 'null'); } catch (e) { return null; }
  }
  function authArgs() {
    const u = me();
    return { uid: (u && u.uid) || '', token: (u && u.token) || '' };
  }

  /* 门禁：未登录 / 等级不足 / 已封禁 */
  function showGate(title, desc, levelText) {
    elGate.classList.add('show');
    $('gateTitle').textContent = title;
    $('gateDesc').textContent = desc;
    const wrap = $('gateLevelWrap');
    if (levelText) {
      wrap.style.display = '';
      $('gateLevel').textContent = levelText;
    } else {
      wrap.style.display = 'none';
    }
    elInput.setAttribute('disabled', 'disabled');
    elSend.disabled = true;
    $('recPanel').style.display = 'none';
  }
  function hideGate() {
    elGate.classList.remove('show');
    elInput.removeAttribute('disabled');
    elSend.disabled = false;
  }

  /* 权限徽章 */
  function renderPermBadges() {
    const a = state.access;
    const vip = $('permVip'), adm = $('permAdmin');
    if (!a.allowed) { vip.classList.remove('show'); adm.classList.remove('show'); return; }
    vip.classList.add('show');
    vip.innerHTML = ICON.crown + '<span>' + esc(a.levelName || 'VIP') + ' 权限</span>';
    if (a.isAdmin) {
      adm.classList.add('show');
      adm.innerHTML = ICON.crown + '<span>最高权限</span>';
    } else {
      adm.classList.remove('show');
    }
  }

  /* 应用权限状态到 UI（门禁 + 徽章 + 推荐面板） */
  function applyAccessUI(meta) {
    const a = state.access;
    if (a.allowed) {
      hideGate();
      renderPermBadges();
      /* 权限态是异步拿到的，空态里的智能入口要重绘一次才会出现 */
      renderMessages();
      loadRecommendations();
    } else {
      const need = (meta && meta.needLevel) || a.needLevel || 'vip';
      const needName = (meta && meta.minLevelName) || (XJ.levelInfo(need) || {}).name || 'VIP';
      $('gateNeed').textContent = needName + ' 及以上';
      const cur = (meta && meta.levelName) || a.levelName || '未登录';
      showGate(
        a.msg || ('XJ AI 为 ' + needName + ' 及以上会员专享'),
        a.msg ? a.msg : '当前会员等级不满足使用条件，升级后即可解锁商店智能助手。',
        cur
      );
      renderPermBadges();
    }
  }

  /* ================= 推荐面板 ================= */
  async function loadRecommendations() {
    if (!state.access.allowed) return;
    const a = authArgs();
    try {
      const r = await fetch('/api/ai/recommend?uid=' + encodeURIComponent(a.uid) +

  /* ================= Markdown（轻量，够用即可） ================= */
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function inlineMd(s) {
    let t = esc(s);
    t = t.replace(/`([^`\n]+)`/g, (m, c) => '<code class="ic">' + c + '</code>');
    t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    t = t.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
    t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return t;
  }
  function codeBlock(c) {
    const lang = String(c.lang || 'text').toLowerCase();
    return '<div class="code"><div class="code-head"><span class="lang">' + esc(lang) +
      '</span><button class="code-copy" type="button" data-copy>复制</button></div>' +
      '<pre><code>' + esc(String(c.code || '').replace(/\n+$/, '')) + '</code></pre></div>';
  }
  function mdToHtml(src) {
    const codes = [];
    let s = String(src || '').replace(/\r\n/g, '\n');
    /* 先抽出围栏代码块（未闭合的围栏也能吃进去，流式输出时不会闪烁） */
    s = s.replace(/```([^\n`]*)\n([\s\S]*?)(?:```|$)/g, (m, lang, code) => {
      const i = codes.push({ lang: (lang || '').trim(), code }) - 1;
      return '\n\u0001' + i + '\u0001\n';
    });
    /* 商品标注 [[商品:ID]] → 占位符（渲染完再还原成可点击卡片） */
    const pr = renderProdRefs(s);
    s = pr.text;

    const out = [];
    let list = null, para = [];
    const flushPara = () => { if (para.length) { out.push('<p>' + inlineMd(para.join(' ')) + '</p>'); para = []; } };
    const flushList = () => { if (list) { out.push('</' + list + '>'); list = null; } };

    s.split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/, '');
      const m = line.match(/^\u0001(\d+)\u0001$/);
      if (m) { flushPara(); flushList(); out.push(codeBlock(codes[+m[1]] || {})); return; }
      if (!line.trim()) { flushPara(); flushList(); return; }
      let mm;
      if ((mm = line.match(/^(#{1,4})\s+(.*)$/))) {
        flushPara(); flushList();
        const lv = Math.min(mm[1].length + 2, 6);
        out.push('<h' + lv + '>' + inlineMd(mm[2]) + '</h' + lv + '>');
        return;
      }
      if (/^([-*_])\1{2,}$/.test(line.trim())) { flushPara(); flushList(); out.push('<hr/>'); return; }
      if ((mm = line.match(/^>\s?(.*)$/))) { flushPara(); flushList(); out.push('<blockquote>' + inlineMd(mm[1]) + '</blockquote>'); return; }
      if ((mm = line.match(/^\s*[-*+]\s+(.*)$/))) {
        flushPara();
        if (list !== 'ul') { flushList(); out.push('<ul>'); list = 'ul'; }
        out.push('<li>' + inlineMd(mm[1]) + '</li>');
        return;
      }
      if ((mm = line.match(/^\s*\d+[.)]\s+(.*)$/))) {
        flushPara();
        if (list !== 'ol') { flushList(); out.push('<ol>'); list = 'ol'; }
        out.push('<li>' + inlineMd(mm[1]) + '</li>');
        return;
      }
      if (list) flushList();
      para.push(line);
    });
    flushPara(); flushList();
    let html = out.join('');
    /* 还原商品引用占位符 → 可点击卡片 */
    html = html.replace(/\u0002(\d+)\u0002/g, (m, i) => prodRefHTML(pr.refs[+i] || ''));
    return html;
  }

  /* 追加一条消息，返回该消息对象 */

  /* 流式渲染节流：每帧最多重绘一次，避免长文卡顿 */
  let rafId = 0;
  function paintStreaming(m) {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = 0;
      const nodes = elMsgs.querySelectorAll('.msg.ai');
      const node = nodes[nodes.length - 1];
      if (!node) { renderMessages(); return; }
      const md = node.querySelector('.md');
      if (!md) { renderMessages(); return; }

  /* 取用户消息的纯文本（用于会话标题 / 重发） */
  function firstUserText(content) {
    if (typeof content === 'string') return content;
    if (Array.isArray(content)) {
      const t = content.filter(p => p.type === 'text').map(p => p.text || '').join(' ');
      return t.trim() || '图片 / 文档对话';
    }
    return '';

  /* 由文本 + 草稿附件拼出待发送的 content（字符串 或 多模态数组） */
  function buildUserContent(text, files) {
    const parts = [];
    if (text && text.trim()) parts.push({ type: 'text', text: text.trim() });
    (files || []).forEach(f => {
      if (f.kind === 'image' && f.dataUrl) parts.push({ type: 'image_url', image_url: { url: f.dataUrl } });
      else if (f.kind === 'doc' && f.text != null) parts.push({ type: 'text', text: '【文档 ' + f.name + '】\n' + f.text });
    });
    if (!parts.length) return null;
    if (parts.length === 1 && parts[0].type === 'text') return parts[0].text;
    return parts;
  }

  /* 由历史消息拼出上游 wire 格式（剔除错误 / 空消息，原样透传多模态数组） */
  function payloadFromMessages(history) {
    const wire = history
      .filter(m => !m.error && m.content && (typeof m.content === 'string' ? m.content.trim() : true))
      .map(m => ({ role: m.role, content: m.content }));
    const a = authArgs();
    return {
      messages: wire,
      model: state.model || undefined,
      stream: true,
      uid: a.uid,
      token: a.token,
      insights: !!state.access.isAdmin,
    };
  }

  async function send(text) {
    if (state.streaming) return;
    if (state.aiClosed) {
      XJ.toast('XJ AI 已临时关闭，暂不可使用');
      return;
    }
    if (!state.access.allowed) {
      XJ.toast(state.access.msg || 'XJ AI 需要 VIP 及以上会员权限');
      return;
    }
    const userText = String(text == null ? elInput.value : text).trim();
    if (!userText && !state.draftFiles.length) return;

    const files = state.draftFiles.slice();
    const content = buildUserContent(userText, files);
    if (!content) return;

    if (!curConv()) newConv();
    appendMsg('user', content, { attachments: files.map(f => ({ kind: f.kind, name: f.name })), _files: files });
    elInput.value = '';
    autoGrow();
    state.draftFiles = [];
    renderAttPreviews();
    state.convs.forEach(c => { if (c.id === state.curId && c.messages.length === 1) c.title = firstUserText(content).slice(0, 22); });
    renderConvList();

    await runStream(curConv().messages);
  }

  /* 真正的流式收发：history 为已确定的上下文，本函数仅追加一条 assistant 占位并流式填充 */
  async function runStream(history) {
    if (state.streaming) return;
    const payload = payloadFromMessages(history);

    setStreaming(true);
    state.abort = new AbortController();
    elHint.textContent = '正在生成…';
    elHint.classList.remove('warn');

    const target = appendMsg('assistant', '');
    renderMessages();
    const lastNode = () => { const n = elMsgs.querySelectorAll('.msg.ai'); return n[n.length - 1]; };
    const node = lastNode();
    if (node) node.querySelector('.md').innerHTML = '<div class="thinking"><i></i><i></i><i></i></div>';

    try {
      const resp = await fetch('/api/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: state.abort.signal,
      });

      const usedModel = resp.headers.get('X-XJ-Model');
      if (usedModel) {
        state.lastModel = decodeURIComponent(usedModel);
        elModelHint.textContent = state.lastModel + ' · 流式输出';
      }

      if (!resp.ok || !resp.body) {
        let msg = '请求失败（HTTP ' + resp.status + '）';
        let j = null;
        try { j = await resp.json(); if (j && j.msg) msg = j.msg; } catch (e) {}
        /* 权限不足：直接切到门禁态，别让用户对着错误气泡发呆 */
        if (resp.status === 401 || resp.status === 403) {
          state.access.allowed = false;
          state.access.msg = msg;
          applyAccessUI(j);
          throw new Error(msg);
        }
        throw new Error(msg);
      }

      const reader = resp.body.getReader();
      const dec = new TextDecoder();
      let buf = '', first = true;

      const handle = chunk => {
        chunk.split('\n').forEach(line => {
          const s = line.trim();
          if (!s.startsWith('data:')) return;
          const data = s.slice(5).trim();
          if (!data || data === '[DONE]') return;
          let j;
          try { j = JSON.parse(data); } catch (e) { return; }
          if (j.error && j.error.message) { throw new Error(j.error.message); }
          const ch = (j.choices || [])[0] || {};
          const d = ch.delta || {};
          let piece = '';
          if (typeof d.content === 'string') piece = d.content;
          else if (Array.isArray(d.content)) piece = d.content.map(c => (c && c.text) || '').join('');
          if (!piece) return;
          if (first) { first = false; target.content = ''; node && node.querySelector('.md') && (node.querySelector('.md').innerHTML = ''); }
          target.content += piece;
          paintStreaming(target);
        });
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let idx;
        while ((idx = buf.indexOf('\n\n')) >= 0) {
          const chunk = buf.slice(0, idx);
          buf = buf.slice(idx + 2);
          handle(chunk);
        }
      }
      if (buf.trim()) handle(buf);

      if (!target.content) target.content = '（模型没有返回内容，换个说法再试一次）';
      target.streaming = false;
      saveConvs();
      renderMessages();
      elHint.textContent = '内容由 AI 生成，请自行核对';
    } catch (err) {
      const aborted = err && err.name === 'AbortError';
      target.streaming = false;
      if (aborted) {
        if (!target.content) target.content = '（已停止）';
        elHint.textContent = '已停止生成';
      } else {
        target.error = true;
        target.content = '出错了：' + ((err && err.message) || '未知错误');
        elHint.textContent = '请求失败，可稍后重试';
        elHint.classList.add('warn');
      }
      saveConvs();
      renderMessages();
    } finally {
      setStreaming(false);
      state.abort = null;
      elInput.focus();
    }
  }

  /* 从指定助手消息往前找最近的用户消息，截掉其后内容并重发（保留图片/文档附件） */
  function retryAct(i) {
    const c = curConv();
    if (!c || !c.messages[i]) return;
    if (state.streaming) return;
    let lastUser = -1;
    for (let k = i - 1; k >= 0; k--) {
      if (c.messages[k].role === 'user') { lastUser = k; break; }
    }
    if (lastUser < 0) return;
    c.messages = c.messages.slice(0, lastUser + 1);
    saveConvs();
    renderMessages();
    runStream(c.messages);
  }

  /* ================= 输入框 ================= */
  function autoGrow() {
    elInput.style.height = 'auto';
    elInput.style.height = Math.min(elInput.scrollHeight, 168) + 'px';
  }

  elInput.addEventListener('input', autoGrow);
  elInput.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      send();
    }
  });
  elSend.addEventListener('click', () => {
    if (state.streaming) {
      if (state.abort) state.abort.abort();
      return;
    }
    send();
  });

  /* ================= 智能功能 ================= */
  /* 加入购物车：用服务端返回的会员价 */
  function addToCart(pid) {
    const p = state.products.find(x => String(x.id) === String(pid));
    if (!p) { XJ.toast('商品不存在'); return; }
    const spec = (p.specs && p.specs[0]) || null;
    const base = (spec && spec.price !== undefined && spec.price !== null && spec.price !== '') ? Number(spec.price) : Number(p.price || 0);
    const rate = XJ.levelInfo((me() || {}).level).rate || 1;
    XJ.cart.add({
      id: p.id,
      title: p.title,
      price: base,
      emoji: p.emoji || '📦',
      color: p.color || '',
      spec: (spec && spec.name) || '默认规格',
      qty: 1,
    });
    XJ.toast('已加入购物车 · 会员价 ¥' + (base * rate).toFixed(2));
  }

  /* 智能功能入口处理 */
  async function handleSmart(kind) {
    if (!state.access.allowed) { XJ.toast(state.access.msg || '权限不足'); return; }
    if (kind === 'rec') {
      await loadRecommendations();
      if (state.recs.length) showRecCards(state.recs, '根据你的会员等级、收藏偏好与商品热度，为你推荐：');
      else XJ.toast('暂无可推荐商品');
      return;
    }
    if (kind === 'stock') {
      const inStock = state.products.filter(p => {
        const st = (p.specs || []).reduce((n, s) => n + (Number(s.stock) || 0), 0);
        return st > 0;
      });
      showRecCards(inStock.slice(0, 6), '当前在售商品（按上架顺序）：');
      return;
    }
    if (kind === 'price') {
      const L = XJ.levelInfo((me() || {}).level);
      const rate = L.rate || 1;
      const sample = state.products.filter(p => Number(p.price || 0) > 0).slice(0, 4);
      showRecCards(sample.map(p => ({
        id: p.id, title: p.title, emoji: p.emoji, color: p.color,
        price: Number(p.price || 0),
        memberPrice: Number((Number(p.price || 0) * rate).toFixed(2)),
        stock: (p.specs || []).reduce((n, s) => n + (Number(s.stock) || 0), 0),
        reason: (L.rate < 1 ? (L.name + ' ' + L.zhe + ' 折') : '当前等级无折扣'),
      })), L.rate < 1
        ? ('你当前是 ' + L.name + '，全店商品享 ' + L.zhe + ' 折（原价 × ' + rate + '），示例：')
        : '你当前等级暂无折扣，示例原价：');
      return;
    }
    if (kind === 'insight') {
      if (!state.access.isAdmin) { XJ.toast('需要 XJ AI 最高权限'); return; }
      const a = authArgs();
      try {
        const r = await fetch('/api/ai/insights?uid=' + encodeURIComponent(a.uid) + '&token=' + encodeURIComponent(a.token));
        const j = await r.json();
        if (!j || !j.ok) { XJ.toast((j && j.msg) || '无法读取经营数据'); return; }
        showRecCards([], '经营洞察（最高权限）：\n\n' + j.insights);
      } catch (e) { XJ.toast('读取经营数据失败'); }
      return;
    }
  }

  /* ================= 事件（委托） ================= */
  elMsgs.addEventListener('click', e => {
    const chip = e.target.closest('[data-chip]');
    if (chip) {
      const s = SUGGESTIONS[+chip.getAttribute('data-chip')];
      if (s) send(s.q);
      return;
    }
    /* 智能功能入口 */
    const smart = e.target.closest('[data-smart]');
    if (smart) { handleSmart(smart.getAttribute('data-smart')); return; }
    /* 商品卡片加购 */
    const addBtn = e.target.closest('[data-addcart]');
    if (addBtn) {
      e.preventDefault();
      addToCart(addBtn.getAttribute('data-addcart'));
      return;
    }
    /* 侧栏推荐项 → 商品详情 */
    const recItem = e.target.closest('.rec-item');
    if (recItem) {
      location.href = 'commodity.html?id=' + encodeURIComponent(recItem.getAttribute('data-pid'));
      return;
    }
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) {
      const box = copyBtn.closest('.code');
      const code = box ? box.querySelector('code') : null;
      if (code) {
        navigator.clipboard.writeText(code.textContent || '')
          .then(() => { copyBtn.textContent = '已复制'; setTimeout(() => { copyBtn.textContent = '复制'; }, 1400); })
          .catch(() => {});
      }
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act) {
      const i = +act.getAttribute('data-i');
      const c = curConv();
      if (!c || !c.messages[i]) return;
      if (act.getAttribute('data-act') === 'copy') {
        navigator.clipboard.writeText(c.messages[i].content || '').then(() => XJ.toast('已复制到剪贴板')).catch(() => {});
      } else if (act.getAttribute('data-act') === 'retry') {
        retryAct(+act.getAttribute('data-i'));
      }
    }
  });

  elConvList.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) {
      e.stopPropagation();
      const id = del.getAttribute('data-del');
      state.convs = state.convs.filter(c => c.id !== id);
      if (state.curId === id) state.curId = (state.convs[0] || {}).id || '';
      if (!state.curId) newConv();
      saveConvs();
      renderConvList();
      renderMessages();
      return;
    }
    const item = e.target.closest('.conv');
    if (item) {
      if (state.streaming && state.abort) state.abort.abort();
      state.curId = item.getAttribute('data-id');
      renderConvList();
      renderMessages();
    }
  });

  function startNewChat() {
    if (state.streaming && state.abort) state.abort.abort();
    newConv();
    renderConvList();
    renderMessages();
    elInput.value = '';
    autoGrow();
    elInput.focus();
  }
  $('newChat').addEventListener('click', startNewChat);
  $('newChatM').addEventListener('click', startNewChat);

  $('clearBtn').addEventListener('click', () => {
    if (state.streaming && state.abort) state.abort.abort();
    const c = curConv();
    if (!c) return;
    c.messages = [];
    c.title = '新对话';
    saveConvs();
    renderConvList();
    renderMessages();
    XJ.toast('已清空当前对话');
  });

  elModel.addEventListener('change', () => {
    state.model = elModel.value;
    try { localStorage.setItem(MODEL_KEY, state.model); } catch (e) {}
    elModelHint.textContent = state.model + ' · 流式输出';
  });

  /* ================= 附件（图片 / 文档） ================= */
  const elAttBtn = $('attachBtn'), elAttInput = $('attInput'), elAttPrev = $('attPrev');

  function fmtSize(b) {
    if (b < 1024) return b + 'B';
    if (b < 1048576) return (b / 1024).toFixed(1) + 'KB';
    return (b / 1048576).toFixed(1) + 'MB';
  }

  function renderAttPreviews() {
    elAttPrev.innerHTML = state.draftFiles.map((f, i) =>
      f.kind === 'image'
        ? '<div class="att-item" data-i="' + i + '"><img src="' + esc(f.dataUrl) + '" alt=""><button class="att-x" data-x="' + i + '" type="button">✕</button></div>'
        : '<div class="att-item" data-i="' + i + '"><span class="att-ico">📄</span><span class="att-name">' + esc(f.name) + ' · ' + fmtSize(f.size) + '</span><button class="att-x" data-x="' + i + '" type="button">✕</button></div>'
    ).join('');
  }

  elAttBtn.addEventListener('click', () => elAttInput.click());
  elAttInput.addEventListener('change', e => {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const isImg = /^image\//.test(file.type);
      if (isImg) {
        if (file.size > 6 * 1024 * 1024) { XJ.toast('图片过大（>6MB）：' + file.name); return; }
        const r = new FileReader();
        r.onload = () => { state.draftFiles.push({ kind: 'image', name: file.name, size: file.size, dataUrl: r.result }); renderAttPreviews(); };
        r.readAsDataURL(file);
      } else {
        if (file.size > 1024 * 1024) { XJ.toast('文档过大（>1MB）：' + file.name); return; }
        const r = new FileReader();
        r.onload = () => { state.draftFiles.push({ kind: 'doc', name: file.name, size: file.size, text: String(r.result || '') }); renderAttPreviews(); };
        r.readAsText(file);
      }
    });
    elAttInput.value = '';
  });
  elAttPrev.addEventListener('click', e => {
    const x = e.target.closest('[data-x]');
    if (!x) return;
    state.draftFiles.splice(+x.getAttribute('data-x'), 1);
    renderAttPreviews();
  });

  /* ================= 手机端切换按钮 ================= */
  $('mobileBtn').addEventListener('click', () => {
    if (window.XJ && XJ.setMobile) {
      XJ.setMobile(!XJ.mobileOn());
      XJ.toast(XJ.mobileOn() ? '已切换到手机端样式' : '已切换到桌面端样式');
    }
  });

  /* ================= 初始化 ================= */
  $('orb').innerHTML = ICON.spark;
  $('gateOrb').innerHTML = ICON.lock;

  state.convs = loadConvs();
  if (!state.convs.length) newConv();
  state.curId = state.convs[0].id;
  state.model = (function () { try { return localStorage.getItem(MODEL_KEY) || ''; } catch (e) { return ''; } })();

  renderConvList();
  renderMessages();
  if (window.XJ && XJ.init) XJ.init({ active: 'ai' });
  autoGrow();

  /* 推荐面板「换一批」 */
  $('recRefresh').addEventListener('click', loadRecommendations);

  /* 侧栏推荐项 → 商品详情 */
  $('recList').addEventListener('click', e => {
    const it = e.target.closest('.rec-item');
    if (!it) return;
    location.href = 'commodity.html?id=' + encodeURIComponent(it.getAttribute('data-pid'));
  });

  /* 拉商品目录（用于商品卡片渲染与智能推荐） */
  fetch('/api/products').then(r => r.json()).then(j => {
    state.products = (j && Array.isArray(j.list)) ? j.list : [];
  }).catch(() => { state.products = []; });

  /* 拉模型目录 + 权限态（失败就退化成默认模型，不阻塞页面） */
  const _a = authArgs();
  fetch('/api/ai/meta?uid=' + encodeURIComponent(_a.uid) + '&token=' + encodeURIComponent(_a.token))
    .then(r => r.json()).then(j => {
    if (!j || !j.ok) throw new Error(j && j.msg || 'meta 失败');
    state.models = Array.isArray(j.models) ? j.models : [];
    state.defaultModel = j.defaultModel || '';
    if (!state.model || !state.models.some(m => m.id === state.model)) {
      state.model = state.defaultModel || (state.models[0] && state.models[0].id) || '';
    }
    /* 模型下拉：支持按 meta.group 分组（如 DeepSeek），并允许 label 覆盖显示名 */
    const meta = j.modelMeta || {};
    const buildOpt = m => {
      const mm = meta[m.id] || {};
      const label = mm.label || m.name || m.id;
      const suffix = mm.actual ? '（' + esc(mm.actual) + '）' : '';
      return '<option value="' + esc(m.id) + '">' + esc(label) + suffix + '</option>';
    };
    const groups = {};
    const ungrouped = [];
    state.models.forEach(m => {
      const g = (meta[m.id] || {}).group;
      if (g) (groups[g] = groups[g] || []).push(m);
      else ungrouped.push(m);
    });
    let html = '';
    ungrouped.forEach(m => { html += buildOpt(m); });
    Object.keys(groups).forEach(g => {
      html += '<optgroup label="' + esc(g) + '">';
      groups[g].forEach(m => { html += buildOpt(m); });
      html += '</optgroup>';
    });
    elModel.innerHTML = html;
    elModel.value = state.model;
    elModelHint.textContent = state.model + ' · 流式输出';

    /* 权限态 */
    const acc = j.access || {};
    state.access.allowed = !!acc.allowed;
    state.access.msg = acc.msg || '';
    state.access.needLevel = acc.needLevel || j.minLevel || 'vip';
    state.access.level = acc.level || '';
    state.access.levelName = acc.levelName || '';
    state.access.isAdmin = !!acc.isAdmin;
    applyAccessUI(j);

    if (!j.enabled) {
      if (j.aiEnabled === false) {
        elHint.textContent = 'XJ AI 已临时关闭（后台可重新开启）';
        state.aiClosed = true;
      } else {
        elHint.textContent = '服务端未配置 AI 密钥，暂时无法对话';
      }
      elHint.classList.add('warn');
    }
  }).catch(err => {
    elModelHint.textContent = '模型列表读取失败';
    elHint.textContent = 'AI 服务暂不可用：' + ((err && err.message) || '');
    elHint.classList.add('warn');
  });
})();
</script>
</body>
</html>
